name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        $HOME/.local/bin/uv pip install --system -e .
        $HOME/.local/bin/uv pip install --system pytest pytest-asyncio httpx
        
    - name: Run tests
      working-directory: ./backend
      env:
        PYTHONPATH: .
        DATABASE_URL: "sqlite:///:memory:"
        JWT_SECRET: "ci_secret_tester"
      run: |
        $HOME/.local/bin/uv run pytest tests/
